<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' file: blob:;" />
<title>语音助手</title>
<link rel="stylesheet" href="hud.css" />
<style>
  html, body {
    margin: 0; padding: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: var(--font);
    color: var(--text);
    -webkit-user-select: none;
    user-select: none;
  }
  /* 窗口高度固定（避免可见状态下改尺寸导致闪烁），卡片贴底渲染 */
  body {
    display: flex;
    align-items: flex-end;
    justify-content: flex-end;
  }

  .hud {
    width: 380px;
    position: relative;
    isolation: isolate;
    transform: none;
    opacity: 1;
    transition: opacity 120ms ease-out;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    /* —— 主题：角色插画 + 白色渐变洗淡，文字区更白、右侧更透 —— */
    background:
      linear-gradient(102deg, rgba(255,255,255,.975) 0%, rgba(255,255,255,.93) 46%, rgba(255,255,255,.56) 100%),
      url("assets/theme.jpg") right 22% / cover no-repeat;
    border: 1px solid rgba(138, 92, 246, .2);
    box-shadow: 0 12px 32px rgba(74, 46, 130, .20);
  }
  /* 主题色：取自插画的紫/青 */
  .hud .dot.listen { background: #8a5cf6; }
  .hud .dot.speak { background: #22b8cf; }
  .hud .dot.error { background: #d13438; }
  .hud .subs p.current .spoken { color: #2b2340; }
  .hud .confirm { background: rgba(255,255,255,.72); }
  .hud .confirm .btn.primary { background: #6d3fd1; border-color: #6d3fd1; }
  .hud .confirm .btn.primary:hover { background: #5c33b4; }

  .hud-avatar {
    width: 40px; height: 40px; border-radius: 12px; object-fit: cover;
    flex: none; border: 1px solid rgba(138, 92, 246, .28);
    box-shadow: 0 2px 6px rgba(109, 63, 209, .18);
  }
  .hud-heading { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
  .hud-title-row { display: flex; align-items: center; gap: 7px; }
  .hud-sub {
    font-size: 11px; color: #7b7391; line-height: 1.3;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .hud-head { align-items: center; padding: 12px 14px 8px 14px; }

  .dragging { opacity: 0; }
</style>
</head>
<body>

<div class="hud" id="hud">
  <div class="hud-head">
    <img class="hud-avatar" src="assets/avatar.jpg" alt="" />
    <div class="hud-heading">
      <div class="hud-title-row">
        <span class="dot" id="dot"></span>
        <span class="hud-title" id="title">聆听中</span>
      </div>
      <span class="hud-sub" id="sub">说「小爱同学」唤醒我</span>
    </div>
    <div class="wave" id="wave" style="display:none"><i></i><i></i><i></i><i></i><i></i></div>
    <button class="hud-x" id="close" title="收起">×</button>
  </div>

  <div class="subs" id="subs"></div>

  <div class="think" id="think" style="display:none">
    <i></i><i></i><i></i><span id="thinkText">正在想…</span>
  </div>

  <div class="confirm" id="confirm" style="display:none">
    <div class="what">
      <div id="confirmWhat"></div>
      <div class="hint">Enter 允许 · Esc 关闭</div>
    </div>
    <button class="btn primary" id="allow">允许</button>
    <button class="btn" id="allowOnce" title="15 分钟内同样的操作不再询问">15 分钟</button>
    <button class="btn" id="deny">拒绝</button>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
