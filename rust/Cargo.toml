[package]
name = "cuava"
version = "0.1.0"
edition = "2021"
description = "Computer Use 语音助手 —— Rust + Slint 原生桌面程序（PR6：语音输入 + 文本 Agent / CUA 闭环）"
publish = false

[lib]
name = "cuava"
path = "src/lib.rs"

[[bin]]
name = "cuava"
path = "src/main.rs"

[dependencies]
# UI：纯 Rust 原生渲染，不使用 Electron / Tauri / WebView。
# 软件渲染器（renderer-winit-software）对虚拟机 / 无 GPU 环境更宽容。
slint = { version = "=1.18.1", default-features = false, features = [
    "compat-1-2",
    "system-tray",
    "unstable-winit-030",
    "std",
    "backend-winit",
    "renderer-winit-software",
    "software-renderer-systemfonts",
] }

tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "process",
    "io-util",
    "sync",
    "fs",
] }
# TLS 走 Windows 自带的 Schannel（reqwest 的 default-tls → native-tls → schannel）。
# 这样不需要 aws-lc-rs / ring 这类要本地 C 工具链的加密库，
# 也不会给"按文档就能构建"增加 NASM / OpenSSL 之类的隐性前置条件。
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "native-tls"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
raw-window-handle = "0.6"
thiserror = "2"
base64 = "0.22"

# ---- 语音输入（PR6）----
# 采集：cpal 在 Windows 上走 WASAPI。回调里只做格式转换/下混，不做推理。
cpal = "0.18"
# 重采样：加窗 sinc + 抗混叠低通（不能用丢样本的朴素做法）。
rubato = "0.16"
# WAV 读写：只用于离线测试与基准，运行期录音不落盘。
hound = "3.5"
# 唤醒词：k2-fsa 官方 Rust 封装，有完整的流式 KWS 接口
# （create_stream / is_ready / decode / reset / get_result）。
#
# 链接方式由本 crate 的 `tts-static` / `tts-cuda` feature 决定，所以这里
# **关掉** sherpa-onnx 自己的默认 feature：否则默认永远带 `static`，
# 再开 `tts-cuda` 就会同时启用 static + shared，sherpa-onnx-sys 的构建
# 脚本会直接报 "Features `static` and `shared` cannot be enabled at the same time"。
# 这就是"必须手改 Cargo.toml 才能切 CUDA"的根因。
sherpa-onnx = { version = "2.0.1", default-features = false }
# ASR：whisper.cpp 1.8.3 的 Rust 绑定（cmake 静态编译），模型进程内复用。
# 默认构建带 CUDA（见 [features]）；没有 CUDA Toolkit 的机器用 CPU 基线构建。
whisper-rs = "0.16"
# 需要 ggml 的**设备枚举**来判断「请求了 GPU」到底有没有真的用上 GPU：
# whisper.cpp 在找不到设备时会静默退回 CPU，只看初始化成功会被误判。
# 这是 whisper-rs 自身的依赖（同一版本、同一份静态库），不是新增原生依赖；
# whisper-rs 把 raw 绑定放在 `raw-api` feature 后面，这里直接依赖 sys crate 更明确。
whisper-rs-sys = { version = "0.15", default-features = false }

[features]
# 默认带 CUDA：这是本项目的推荐运行方式（实测 CUDA 205ms vs CPU 2335ms）。
# 构建 CUDA 版需要本机 CUDA Toolkit（nvcc + cudart/cublas）与 NVIDIA 驱动。
#
# 没有 CUDA 工具链的开发机 / CI 用 CPU-only 构建：
#   cargo build --release --no-default-features
# 两条路径都能运行同一份代码；运行时后端由 `voice::asr` 如实上报。
default = ["cuda"]
cuda = ["whisper-rs/cuda"]
# 本地 TTS 的 sherpa-onnx 链接方式：**二选一**，默认静态（单文件分发）。
tts-static = ["sherpa-onnx/static"]
# 本地 TTS（Kokoro）走 CUDA：需要 shared 版 GPU 运行时。
#
# 与 Whisper 的 `cuda` 是两件独立的事：`cuda` 只影响 whisper.cpp，
# 这里只影响 sherpa-onnx。启用后 Cargo 会把 sherpa-onnx 切成 shared，
# 必须同时提供 `SHERPA_ONNX_LIB_DIR`（指向 GPU 版运行时的 lib 目录），
# build.rs 会校验该目录里确实有 onnxruntime_providers_cuda.dll。
#
# **实验性**：本仓库的验证环境没有可用的 cuDNN 9，因此 CUDA 合成路径
# **未在真实 GPU 上实测通过**。详见 rust/README.md「本地 TTS 用 CUDA」。
tts-cuda = ["sherpa-onnx/shared"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Security_Cryptography",
    "Win32_System_SystemInformation",
    "Win32_System_Time",
] }

[build-dependencies]
slint-build = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "io-util", "sync", "fs", "net"] }
# 语音端到端测试直接用 whisper 上下文（与工作线程同一套调用）。
whisper-rs = "0.16"
hound = "3.5"
# 唤醒词 / 本地 TTS 用默认的静态 sherpa-onnx（与主依赖同一套 feature 选择）。
sherpa-onnx = { version = "2.0.1", default-features = false }
# TTS 流式协议测试要自己造 Base64 音频块（与运行期同一个解码器）。
base64 = "0.22"

# 构建注意（写在这里，比 README 更靠近构建系统）：
# whisper-rs-sys 用 CMake + Ninja 现场编译 whisper.cpp，MSVC 在**很长的中文路径**
# 下偶发 `cl.exe error D8050 / c1.dll`（命令行放不进调试记录）。
#
# 两个解法，任选其一：
#  1. 把本仓库放在**较短且纯 ASCII** 的路径下（推荐，最省事）；
#  2. 若仓库路径本身很长，改用 Visual Studio 生成器：
#       set CMAKE_GENERATOR="Visual Studio 18 2026"
#     并把 SHERPA_ONNX_LIB_DIR 指到已解压的 sherpa-onnx 静态库。
#
# 这个设置只影响 whisper.cpp 这类 C/C++ 子构建，不影响 Rust 代码本身。
[profile.release]
opt-level = 2
