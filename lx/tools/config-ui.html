<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>语音助手 · 模型配置</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262b36; --text: #e6e9ef;
    --muted: #9aa4b2; --accent: #4c8dff; --ok: #35c37d; --bad: #ef5b5b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    display: flex; justify-content: center; padding: 40px 20px;
  }
  .wrap { width: 100%; max-width: 720px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
  .field { margin-bottom: 18px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  input, select {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line);
    background: #0d0f14; color: var(--text); font-size: 14px; font-family: inherit;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  .row { display: flex; gap: 16px; }
  .row > .field { flex: 1; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .actions { display: flex; gap: 12px; align-items: center; margin-top: 24px; }
  button {
    padding: 10px 18px; border-radius: 8px; border: 1px solid var(--line);
    background: #1e2229; color: var(--text); font-size: 14px; cursor: pointer; font-family: inherit;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  #status { font-size: 13px; }
  #status.ok { color: var(--ok); }
  #status.bad { color: var(--bad); }
  pre {
    background: #0d0f14; border: 1px solid var(--line); border-radius: 8px;
    padding: 14px; overflow: auto; font-size: 12px; color: var(--muted); max-height: 220px;
  }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; background: #1e2229; font-size: 12px; color: var(--muted); margin-left: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>模型配置</h1>
  <div class="sub">选择提供商与模型。密钥只保存在本机，界面只显示掩码。</div>

  <div class="card">
    <div class="field">
      <label for="provider">提供商</label>
      <select id="provider"></select>
      <div class="hint" id="providerNote"></div>
    </div>

    <div class="field">
      <label for="baseURL">接口地址（OpenAI 兼容）</label>
      <input id="baseURL" spellcheck="false" placeholder="https://api.deepseek.com/v1" />
    </div>

    <div class="field">
      <label for="model">模型<span class="badge" id="modelBadge"></span></label>
      <input id="model" list="modelList" spellcheck="false" placeholder="deepseek-flash" />
      <datalist id="modelList"></datalist>
      <div class="hint">可直接输入；本地 llama.cpp 请填 /v1/models 返回的名字。</div>
    </div>

    <div class="field">
      <label for="apiKey">API Key</label>
      <input id="apiKey" type="password" spellcheck="false" placeholder="留空表示不修改" />
      <div class="hint">已保存的密钥不会回显；留空保存即保持原值。</div>
    </div>

    <div class="row">
      <div class="field">
        <label for="temperature">温度</label>
        <input id="temperature" type="number" min="0" max="2" step="0.1" />
      </div>
      <div class="field">
        <label for="maxSteps">最大步数</label>
        <input id="maxSteps" type="number" min="1" max="20" step="1" />
      </div>
    </div>

    <hr style="border:none;border-top:1px solid var(--line);margin:26px 0 22px" />

    <div class="field">
      <label for="searchKey">联网搜索 Key（Tavily）<span class="badge" id="searchBadge"></span></label>
      <input id="searchKey" type="password" spellcheck="false" placeholder="留空表示不修改" />
      <div class="hint">
        填了之后助手才会拿到 <code>web_search</code> 工具；没填时这个工具根本不会出现在模型面前。
        查询词会发给 Tavily，每次调用都记审计日志。
      </div>
    </div>
    <div class="actions" style="margin-top:0">
      <button id="testSearch">测试搜索</button>
      <button id="clearSearch">清除搜索 Key</button>
      <span id="searchStatus" style="font-size:13px"></span>
    </div>

    <div class="actions">
      <button class="primary" id="save">保存</button>
      <button id="test">测试连接</button>
      <span id="status"></span>
    </div>

    <div style="margin-top:20px">
      <label>检测详情</label>
      <pre id="detail">尚未测试。</pre>
    </div>
  </div>
</div>

<script type="module">
const $ = (id) => document.getElementById(id)
let state = null

function setStatus(text, kind = '') {
  $('status').textContent = text
  $('status').className = kind
}

async function api(path, options = {}) {
  const res = await fetch(path, {
    headers: { 'content-type': 'application/json' },
    ...options,
  })
  const json = await res.json().catch(() => ({}))
  return { ok: res.ok, json }
}

function renderProviders() {
  const select = $('provider')
  select.innerHTML = ''
  for (const provider of state.providers) {
    const option = document.createElement('option')
    option.value = provider.id
    option.textContent = provider.name
    select.append(option)
  }
  select.value = state.config.providerId
}

function renderProviderNote() {
  const provider = state.providers.find((p) => p.id === $('provider').value)
  $('providerNote').textContent = provider ? provider.notes : ''
  const list = $('modelList')
  list.innerHTML = ''
  for (const model of provider?.models ?? []) {
    const option = document.createElement('option')
    option.value = model
    list.append(option)
  }
  $('modelBadge').textContent = provider ? `${provider.models.length || '自定义'} 个预设` : ''
}

function fillForm() {
  const c = state.config
  $('provider').value = c.providerId
  $('baseURL').value = c.baseURL
  $('model').value = c.model
  $('apiKey').value = ''
  $('apiKey').placeholder = c.hasApiKey ? `已保存（${c.apiKey}），留空不修改` : '未配置'
  $('temperature').value = c.temperature
  $('maxSteps').value = c.maxSteps
  // 搜索 key：同一套"留空不修改"的语义
  $('searchKey').value = ''
  $('searchKey').placeholder = c.search?.hasApiKey ? `已保存（${c.search.apiKey}），留空不修改` : '未配置（可选）'
  $('searchBadge').textContent = c.search?.hasApiKey ? '已启用' : '未启用'
  renderProviderNote()
}

async function load() {
  const { json } = await api('/api/state')
  state = json
  renderProviders()
  fillForm()
}

$('provider').addEventListener('change', () => {
  const provider = state.providers.find((p) => p.id === $('provider').value)
  if (provider) {
    $('baseURL').value = provider.baseURL
    if (provider.models.length > 0) $('model').value = provider.models[0]
  }
  renderProviderNote()
})

$('save').addEventListener('click', async () => {
  setStatus('保存中…')
  $('save').disabled = true
  const payload = {
    providerId: $('provider').value,
    baseURL: $('baseURL').value.trim(),
    model: $('model').value.trim(),
    temperature: Number($('temperature').value),
    maxSteps: Number($('maxSteps').value),
  }
  if ($('apiKey').value.trim() !== '') payload.apiKey = $('apiKey').value.trim()
  // 搜索 key 一并提交：空就不带（=不修改），有值才写
  if ($('searchKey').value.trim() !== '') payload.search = { provider: 'tavily', apiKey: $('searchKey').value.trim() }
  const { ok, json } = await api('/api/config', { method: 'POST', body: JSON.stringify(payload) })
  $('save').disabled = false
  if (ok && json.ok) {
    state.config = json.config
    fillForm()
    setStatus('已保存', 'ok')
  } else {
    setStatus(json.error ?? '保存失败', 'bad')
  }
})

$('test').addEventListener('click', async () => {
  setStatus('测试中…')
  $('test').disabled = true
  const payload = {
    providerId: $('provider').value,
    baseURL: $('baseURL').value.trim(),
    model: $('model').value.trim(),
  }
  if ($('apiKey').value.trim() !== '') payload.apiKey = $('apiKey').value.trim()
  const { json } = await api('/api/test', { method: 'POST', body: JSON.stringify(payload) })
  $('test').disabled = false
  $('detail').textContent = JSON.stringify(json, null, 2)
  if (json.ok) setStatus(`连接正常（${json.checks?.chat?.ms ?? '?'}ms）`, 'ok')
  else setStatus(json.error ?? json.checks?.chat?.error ?? '连接失败', 'bad')
})

$('testSearch').addEventListener('click', async () => {
  $('searchStatus').textContent = '搜索中…'
  $('testSearch').disabled = true
  const payload = { query: '上海今天天气' }
  if ($('searchKey').value.trim() !== '') payload.apiKey = $('searchKey').value.trim()
  const { json } = await api('/api/test-search', { method: 'POST', body: JSON.stringify(payload) })
  $('testSearch').disabled = false
  $('detail').textContent = JSON.stringify(json, null, 2)
  $('searchStatus').textContent = json.ok
    ? `搜索正常（${json.ms}ms，${json.count} 条）`
    : (json.error ?? '搜索失败')
  $('searchStatus').className = json.ok ? 'ok' : 'bad'
})

$('clearSearch').addEventListener('click', async () => {
  const { ok, json } = await api('/api/config', {
    method: 'POST',
    body: JSON.stringify({ search: { provider: 'tavily', apiKey: null } }),
  })
  if (ok && json.ok) {
    state.config = json.config
    fillForm()
    setStatus('搜索 Key 已清除', 'ok')
  } else {
    setStatus(json.error ?? '清除失败', 'bad')
  }
})

await load()
</script>
</body>
</html>
